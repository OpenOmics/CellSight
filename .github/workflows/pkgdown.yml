name: pkgdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    container:
      image: rroutsong/cellsight_builder:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure pkgdown and vignette tooling are available
        run: |
          Rscript -e 'for (p in c("pkgdown", "knitr", "rmarkdown", "styler")) if (!requireNamespace(p, quietly = TRUE)) install.packages(p, repos = "https://cloud.r-project.org")'

      - name: Install cellsight
        run: |
          Rscript -e 'if ("cellsight" %in% installed.packages()[,"Package"]) remove.packages("cellsight")'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      - name: Build site
        run: |
          Rscript -e 'pkgdown::build_site(".", examples = FALSE, preview = FALSE, new_process = FALSE, install = FALSE)'

      - name: Disable Jekyll processing (required for pkgdown assets)
        run: touch docs/.nojekyll

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: pkgdown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
